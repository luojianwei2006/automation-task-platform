# Project-wide Gradle settings.

# Enable AndroidX
android.useAndroidX=true

# Enable Jetifier to migrate support libraries
android.enableJetifier=true

# Specify Java 17 to avoid compatibility issues with Java 21
org.gradle.java.home=/Users/luojianwei/Library/Java/JavaVirtualMachines/jbr-17.0.14/Contents/Home

# Enable Gradle build cache
org.gradle.caching=true

# Enable parallel build
org.gradle.parallel=true

# Enable configuration caching
org.gradle.configuration-cache=true

# Set JVM arguments for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

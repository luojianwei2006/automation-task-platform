server:
  port: 8084

spring:
  application:
    name: task-admin-api
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://localhost:3306/task_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: task_user
    password: Task@2026!
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      validation-query: SELECT 1

  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置（与用户服务共享密钥）
jwt:
  secret: your-256-bit-secret-key-here-must-be-32-chars

logging:
  level:
    com.task.platform: DEBUG
    org.springframework.security: INFO

# 用户服务配置
server:
  port: 8081

spring:
  application:
    name: task-user-service
  
  # 数据源配置（Druid连接池）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/task_platform?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: task_user
    password: StrongPassword123!
    
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开发环境打印SQL
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: status
      logic-not-value: 0

# JWT密钥（生产环境从配置中心读取）
jwt:
  secret: TaskPlatformSecretKey2026@AutoTask#$%^&*()_+1234567890
  expiration: 2592000000  # 30天（毫秒）

# 日志配置
logging:
  level:
    root: INFO
    com.task.platform: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

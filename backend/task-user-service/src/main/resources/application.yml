    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://118.145.198.135:3306/task_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: task_user
    password: Task@2026!
    
  # Redis配置
  data:
    redis:
      host: localhost

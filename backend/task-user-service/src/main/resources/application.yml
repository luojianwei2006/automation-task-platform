# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开发环境打印SQL
  global-config:
    db-config:
      id-type: auto
      # 逻辑删除字段：如需启用，取消注释并创建deleted字段
      # logic-delete-field: deleted
      # logic-delete-value: 1
      # logic-not-delete-value: 0

